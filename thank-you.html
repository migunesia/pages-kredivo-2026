<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162947">
  <meta name="description" content="Thank you for registering for Kredivo's Once Upon a Time in Shanghai event.">
  <title>Thank You — Once Upon a Time in Shanghai | Kredivo</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <main class="thank-you-poster" aria-labelledby="thank-you-title">
    <!-- Decorative artwork, and the Kredivo logo on mobile, are background images.
         Every word and the QR code itself are real, replaceable HTML elements. -->
    <div class="thank-you-event-name" aria-label="Once Upon a Time in Shanghai">
      <span>Once Upon a Time</span>
      <span>in Shanghai</span>
    </div>

    <div class="thank-you-qr-section">
      <!-- Replace BOTH the PNG and URL after receiving the official event link.
           Current QR points to https://example.com/kredivo-year-end (placeholder). -->
      <a class="thank-you-qr-link" href="https://example.com/kredivo-year-end" target="_blank" rel="noopener noreferrer" aria-label="Open the event link (currently a placeholder)">
        <img class="thank-you-qr" src="./assets/qr-code.png" alt="QR code for the event link" width="372" height="372" loading="eager">
      </a>
      <a class="thank-you-qr-caption" href="https://example.com/kredivo-year-end" target="_blank" rel="noopener noreferrer">link.kredivoyearend</a>
    </div>

    <section class="thank-you-message" aria-labelledby="thank-you-title">
      <h1 id="thank-you-title">Thank You!</h1>
      <p><span>Your RSVP has been</span><span>successfully submitted</span></p>
    </section>
  </main>
</body>
</html>
