<!doctype html>
<html lang="en">
<head>

  <picture class="art detail-guest" >
    <source media="(max-width: 900px), (orientation: portrait)" srcset="./assets/img/phone/page-2/avatar-1.png">

  <picture class="art detail-group" >

</html>
